<div class="row">
  <div class="col">
    <h4>Waiting</h4>
    <ul class="list-group">
      <li
        class="list-group-item"
        *ngFor="let t of waiting(); trackBy: trackById"
      >
        <strong>{{ t.name }}</strong> — {{ t.content }}
        <select
          class="form-select d-inline-block w-auto ms-2"
          [value]="t.status"
          (change)="updateStatus(t.id, $any($event.target).value)"
        >
          <option value="waiting">waiting</option>
          <option value="in progress">in progress</option>
          <option value="done">done</option>
        </select>
        <button class="btn btn-sm btn-danger float-end" (click)="deleteTodo(t.id)">Delete</button>
      </li>
    </ul>
  </div>

  <div class="col">
    <h4>In progress</h4>
    <ul class="list-group">
      <li
        class="list-group-item"
        *ngFor="let t of inProgress(); trackBy: trackById"
      >
        <strong>{{ t.name }}</strong> — {{ t.content }}
        <select
          class="form-select d-inline-block w-auto ms-2"
          [value]="t.status"
          (change)="updateStatus(t.id, $any($event.target).value)"
        >
          <option value="waiting">waiting</option>
          <option value="in progress">in progress</option>
          <option value="done">done</option>
        </select>
        <button class="btn btn-sm btn-danger float-end" (click)="deleteTodo(t.id)">Delete</button>
      </li>
    </ul>
  </div>

  <div class="col">
    <h4>Done</h4>
    <ul class="list-group">
      <li class="list-group-item" *ngFor="let t of done(); trackBy: trackById">
        <strong>{{ t.name }}</strong> — {{ t.content }}
        <select
          class="form-select d-inline-block w-auto ms-2"
          [value]="t.status"
          (change)="updateStatus(t.id, $any($event.target).value)"
        >
          <option value="waiting">waiting</option>
          <option value="in progress">in progress</option>
          <option value="done">done</option>
        </select>
        <button class="btn btn-sm btn-danger float-end" (click)="deleteTodo(t.id)">Delete</button>
      </li>
    </ul>
  </div>
</div>

<div class="row mt-3">
  <div class="col-8">
    <input class="form-control mb-2" placeholder="Name" [(ngModel)]="name" rainbow />
    <input class="form-control mb-2" placeholder="Content" [(ngModel)]="content" rainbow />
    <select class="form-select mb-2" [(ngModel)]="status">
      <option value="waiting">waiting</option>
      <option value="in progress">in progress</option>
      <option value="done">done</option>
    </select>
    <button class="btn btn-primary" (click)="addTodo()" [disabled]="!name().trim() || !content().trim()">Add Todo</button>
  </div>
</div>
